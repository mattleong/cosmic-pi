name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.22.2, 24.15.0, 26]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        # pnpm silently skips an optional platform binary whose download keeps failing, so retry
        # transient registry errors more than the default two times.
        env:
          npm_config_fetch_retries: 5
        run: pnpm install --frozen-lockfile

      - name: Validate packages
        run: pnpm validate

name: Publish npm packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (for example, v0.2.0)
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: pnpm

      - name: Verify release tag and versions
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Release tag must look like v0.2.0: $RELEASE_TAG"; exit 1 ;;
          esac
          VERSION="${RELEASE_TAG#v}"
          node scripts/check-versions.mjs "$VERSION"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate workspace
        run: pnpm validate

      - name: Publish unpublished packages
        run: |
          set -euo pipefail
          for package_dir in packages/*; do
            PACKAGE_NAME="$(node -p "require('./$package_dir/package.json').name")"
            PACKAGE_VERSION="$(node -p "require('./$package_dir/package.json').version")"

            if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version >/dev/null 2>&1; then
              echo "Skipping $PACKAGE_NAME@$PACKAGE_VERSION; it is already published."
              continue
            fi

            (
              cd "$package_dir"
              pnpm publish --access public --provenance
            )
          done

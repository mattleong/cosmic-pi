packages:
  - packages/*
  # The private Code Mode runtime is nested inside the public pi-code-mode package so its
  # TypeScript source ships inside the pi-code-mode tarball (see ADR 0003).
  - packages/pi-code-mode/runtime

catalog:
  "@earendil-works/pi-ai": 0.85.0
  "@earendil-works/pi-coding-agent": 0.85.0
  "@earendil-works/pi-server": 0.85.0
  "@earendil-works/pi-tui": 0.85.0
  "@effect/platform-node": 4.0.0-rc.111
  "@effect/vitest": 4.0.0-rc.111
  "@oxlint/plugins": 1.78.0
  "@types/node": ~22.19.0
  acorn: 8.15.0
  effect: 4.0.0-rc.111
  oxfmt: ^0.47.0
  oxlint: 1.78.0
  typebox: 1.1.38
  typescript: 7.0.2
  typescript-compiler-api: npm:typescript@6.0.3
  vitest: ^4.1.5

engineStrict: true
strictPeerDependencies: true

# Pi 0.85.0 imports this package without declaring it (upstream issue #9132).
packageExtensions:
  "@earendil-works/pi-coding-agent@0.85.0":
    dependencies:
      "@earendil-works/pi-server": 0.85.0

onlyBuiltDependencies:
  - "@google/genai"
  - esbuild
  - protobufjs
  - sharp
